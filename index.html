:root{
  --bg:#FFFAFA;--surface:#FFFFFF;--sand:#F7E9DE;--beach:#F4E2DA;--blush:#F2DFDF;--glow:#FFD8D8;
  --cosmos:#59445B;--nav:#81687F;--poppy:#C25C9A;--poppy-soft:#CF89AE;--wine:#8C3D4C;--brown:#4F3422;
  --ink:#1E1E1E;--text:#231C1F;--muted:#585858;--faint:#999999;--line:#E8DCD7;--chip:#FAFAFA;
  --chip-line:rgba(56,54,54,.5);--on-accent:#FFFAFA;--nav-text:#F7E9DE;--alert:#C2353A;--ok:#3E7A4C;--on-wine:#FFFFFF;
  --card-shadow:0 4px 4px #E2DCDC;--soft-shadow:0 1.5px 3px rgba(0,0,0,.22);--float:0 18px 40px -18px rgba(89,68,91,.35);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C171C;--surface:#28212A;--sand:#3A2E36;--beach:#3B2D32;--blush:#30252C;--glow:#4C2B3D;
    --cosmos:#8E7191;--nav:#4C3C4E;--poppy:#D272B0;--poppy-soft:#A86A8C;--wine:#E59CAA;--brown:#EBD6CA;
    --ink:#F6ECEE;--text:#EDE2E5;--muted:#BBADB3;--faint:#8D8188;--line:#40343B;--chip:#2E262E;
    --chip-line:rgba(255,240,245,.35);--nav-text:#F7E9DE;--alert:#FF8C8C;--ok:#8FD19E;--on-wine:#1C171C;
    --card-shadow:0 4px 12px rgba(0,0,0,.35);--soft-shadow:0 1.5px 3px rgba(0,0,0,.5);--float:0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C171C;--surface:#28212A;--sand:#3A2E36;--beach:#3B2D32;--blush:#30252C;--glow:#4C2B3D;
  --cosmos:#8E7191;--nav:#4C3C4E;--poppy:#D272B0;--poppy-soft:#A86A8C;--wine:#E59CAA;--brown:#EBD6CA;
  --ink:#F6ECEE;--text:#EDE2E5;--muted:#BBADB3;--faint:#8D8188;--line:#40343B;--chip:#2E262E;
  --chip-line:rgba(255,240,245,.35);--nav-text:#F7E9DE;--alert:#FF8C8C;--ok:#8FD19E;--on-wine:#1C171C;
  --card-shadow:0 4px 12px rgba(0,0,0,.35);--soft-shadow:0 1.5px 3px rgba(0,0,0,.5);--float:0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column}
.welcome,.ob,.ready{flex:1 0 auto}
.main{width:100%}
h1,h2,h3,p{margin:0}
.serif{font-family:"Crimson Text",Georgia,"Times New Roman",serif}
.script{font-family:Caveat,"Segoe Script","Bradley Hand",cursive}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--poppy);outline-offset:3px;border-radius:8px}
svg{display:block}
.ic{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{display:flex;justify-content:center}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:148px;height:45px;padding:0 26px;border-radius:30px;background:var(--cosmos);color:var(--on-accent);font:400 20px/1 "Crimson Text",Georgia,serif;transition:transform .2s var(--ease),background .3s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.poppy{background:var(--poppy);font-weight:600}
.btn.sm{min-width:112px;height:35px;font-size:14px;font-weight:600;padding:0 18px}
.btn.wide{width:100%;max-width:343px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{color:var(--poppy);font-size:15px;padding:8px;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);transition:background .2s}
.iconbtn:hover{background:var(--blush)}
.iconbtn.light{color:#fff}
.iconbtn.light:hover{background:rgba(255,255,255,.15)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:20px;background:var(--chip);border:.5px solid var(--chip-line);font:400 14px/1 Roboto,sans-serif;color:var(--ink);white-space:nowrap;transition:background .25s var(--ease),color .25s}
.chip.on{background:var(--poppy);border-color:var(--poppy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.tag{display:inline-block;font:500 11px/1 Roboto,sans-serif;padding:4px 8px;border-radius:20px;background:var(--sand);color:var(--brown);vertical-align:middle}
.card{background:var(--surface);border-radius:20px;padding:18px 22px}

/* Splash */
.splash{position:fixed;inset:0;background:var(--bg);overflow:hidden;z-index:60;cursor:pointer}
.sgrp{position:absolute;left:50%;top:50%;width:0;height:0}
.sc{position:absolute;width:112px;height:112px;left:-56px;top:-56px;border-radius:50%;background:var(--cosmos);opacity:0;will-change:transform,opacity}
.splash-copy{position:absolute;left:50%;top:50%;width:260px;transform:translate(-130px,-6px);pointer-events:none}
.splash-copy .word{font-size:48px;line-height:1;color:var(--wine);clip-path:inset(0 100% 0 0);font-weight:500}
.splash-copy p{font-size:32px;line-height:30px;color:var(--ink);margin-top:16px;width:230px;opacity:0}
.skip{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--muted);padding:10px 14px;border-radius:20px}

/* Welcome */
.welcome{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px;overflow:hidden}
.welcome::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36%;background:linear-gradient(180deg,var(--bg) 0%,var(--blush) 80.5%);z-index:0;pointer-events:none}
.wl-grid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
.collage{position:relative;width:min(306px,78vw,calc(52dvh*.612));aspect-ratio:306/500;margin-top:22px}
.collage .p{position:absolute;overflow:hidden;background:var(--sand)}
.collage svg{width:100%;height:100%}
.p1{left:0;top:0;width:48%;height:52.2%;border-radius:999px}
.p2{left:54.6%;top:1.2%;width:37.9%;height:24.2%;border-radius:50%}
.p3{left:53.9%;top:27.2%;width:41.2%;height:44.8%;border-radius:999px}
.p4{left:.6%;top:54.8%;width:47.4%;height:30.2%;border-radius:50%}
.p5{left:47.4%;top:73.6%;width:52.6%;height:33.5%;border-radius:50%}
.p5::after{content:"";position:absolute;inset:0;background:linear-gradient(0.72deg,var(--bg) 49.5%,rgba(255,255,255,0) 99%)}
.wl-copy{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-6px}
.care{position:relative;font-size:32px;line-height:30px;font-weight:400;color:var(--ink);text-align:left;width:220px}
.care .hl{position:relative;z-index:0}
.care .hl::before{content:"";position:absolute;left:-14px;right:-6px;top:1px;height:35px;border-radius:20px;background:linear-gradient(90.46deg,rgba(242,223,223,.3) .47%,rgba(242,174,173,.55) 50%,rgba(243,225,225,.3) 99.7%);z-index:-1}
.care .aw{font-size:34px;color:var(--brown);margin-left:4px}
.wl-logo{color:var(--cosmos);position:relative;z-index:1}

/* Onboarding */
.ob{min-height:100%;display:grid;grid-template-columns:1fr}
.ob-art{display:none}
.ob-in{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:20px 23px 36px;min-height:100%}
.ob-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:30px;color:var(--cosmos)}
.ob-top .lg{justify-self:center}
.h-ob{font-size:28px;line-height:30px;font-weight:400;color:var(--ink)}
.h-ob.b{font-weight:600}
.sub-ob{font-size:24px;line-height:30px;margin:10px 0 24px;color:var(--ink)}
.ob-foot{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.fld>label,.fld>.lbl{font:500 16px/1.5 Roboto,sans-serif;letter-spacing:-.011em;color:var(--ink);padding-left:13px}
.inp{width:100%;height:56px;border-radius:1000px;background:var(--surface);border:1px solid transparent;box-shadow:var(--soft-shadow);padding:0 24px;font-size:16px;outline:none;transition:border .2s}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--cosmos)}
.inp.err{border-color:var(--alert)}
.errt{font-size:13px;color:var(--alert);padding-left:16px;min-height:0}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 24px 0 31px;border-radius:1000px;background:var(--surface);border:1px solid transparent;margin-bottom:14px;font-size:16px;color:var(--ink);transition:border .2s}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--ink)}
.opt .hrt{color:#C9C7C5;transition:color .25s,transform .3s var(--ease)}
.opt[aria-pressed="true"] .hrt{color:var(--wine);transform:scale(1.12)}
.qlbl{font-size:24px;line-height:30px;margin:18px 0 18px}
.tg{position:relative;display:flex;align-items:center;height:56px;width:100%;padding:4px;border-radius:32px;background:var(--surface)}

@keyframes nudge{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
:root[data-theme="dark"] .ready .rw,:root[data-theme="dark"] .swipe{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ready .rw,:root:not([data-theme="light"]) .swipe{color:var(--ink)}}

/* App shell */
.navwrap{position:fixed;left:0;right:0;bottom:0;padding:0 9px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none}

.nav button{flex:1;text-align:center;font:400 14px/30px "Crimson Text",Georgia,serif;color:var(--nav-text);padding:6px 2px;border-radius:14px;white-space:nowrap}

.main{position:relative;isolation:isolate;max-width:1120px;margin:0 auto;padding:16px 20px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
.topbar .brand{font-size:22px;color:#271A11}

@media (min-width:960px){

  .nav button{flex:none;text-align:left;font-size:19px;padding:8px 16px}
  .nav button[aria-current="page"]{background:rgba(255,250,250,.13);text-decoration:none}
  .nav .nlogo{margin:0 0 30px 10px;padding:0;background:none!important}
  .nav .nword{display:inline;font-size:30px;color:#FFFAFA;line-height:1}
  .nav .nav-sos{display:block;margin-top:auto;text-align:center;background:var(--wine);color:#fff;font-weight:600;border-radius:30px;padding:10px}
  .main{margin-left:270px;margin-right:auto;padding:24px 44px 60px;max-width:1080px}
  .topbar .brand{visibility:hidden}
}

/* Home */
.home{display:grid;gap:8px}
.dtitle{font-size:24px;line-height:30px;font-weight:400;color:var(--ink);margin-top:14px}
.subsec{font:600 20px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin:2px 0 12px}
.sec{font:600 20px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin:26px 0 12px}
.sos-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 10px;border-radius:30px;background:var(--wine);color:#fff;font:600 15px/1 Roboto,sans-serif;margin-top:14px}

.three{display:grid;grid-template-columns:repeat(3,96px);gap:7px}
.ins{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:96px;height:111px;padding:10px 12px 12px;border-radius:10px;background:var(--bg);box-shadow:0 4px 4px rgba(0,0,0,.18);font:500 12px/15px Roboto,sans-serif;color:var(--ink);text-align:left}
.ins .ip{align-self:center;width:32px;height:31px;border-radius:50%;background:#7C6780;color:#fff;display:flex;align-items:center;justify-content:center}

.journey-wrap{position:relative;padding:20px 0 4px}
.glowbg{position:absolute;left:-60px;top:-20px;width:300px;height:280px;border-radius:50%;background:radial-gradient(closest-side,var(--glow) 0%,transparent 100%);z-index:-1;pointer-events:none;opacity:.9}
.datechip{display:block;width:max-content;margin:0 auto;padding:2px 14px;border-radius:20px;background:rgba(217,217,217,.4);border:1px solid rgba(255,255,255,.8);font:400 12px/20px "Crimson Text",Georgia,serif;color:var(--muted)}
.journey{font:400 32px/30px "Crimson Text",Georgia,serif;color:var(--ink);text-align:center;max-width:180px;margin:18px auto 22px}
.journey-wrap .chips{justify-content:center;margin-bottom:22px}
.feed{display:grid;gap:17px;justify-items:center}
.fcard{position:relative;display:block;width:100%;max-width:297px;height:185px;border-radius:20px;overflow:hidden;color:#fff;text-align:left;transition:transform .35s var(--ease)}
.fcard:active{transform:scale(.98)}
.fcard.g1{background:linear-gradient(111.31deg,#80677E 60.94%,#F7DAC3 98.43%)}
.fcard.g2{background:linear-gradient(124.42deg,#FCD9C9 1.35%,#C35E9C 34.54%)}
.fcard.g3{background:linear-gradient(120deg,#4F3422 0%,#8C3D4C 60%,#E7B6A4 100%)}
.fcard.g4{background:linear-gradient(115deg,#59445B 30%,#C25C9A 100%)}
.fc-title{position:absolute;left:28px;top:20px;width:150px;font:400 28px/30px "Crimson Text",Georgia,serif;z-index:1}
.fc-meta{position:absolute;left:28px;bottom:16px;font:400 12px/20px Roboto,sans-serif;z-index:1;display:grid;gap:2px}
.fc-meta span{display:flex;align-items:center;gap:6px}
.fc-meta .ic{width:12px;height:12px}

.fc-art{position:absolute;right:-6px;bottom:0;width:58%;max-width:200px;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%)}
.fc-art svg{width:100%;height:100%}
.empty{padding:26px 20px;text-align:center;color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:20px;max-width:340px;margin:0 auto}
.contacts .ct{padding:12px 0;border-bottom:1px solid var(--line)}
.contacts .ct:last-child{border-bottom:0}
.ct-name{font:400 24px/30px "Crimson Text",Georgia,serif;color:var(--ink)}
.ct-ph{font:600 20px/30px "Crimson Text",Georgia,serif;color:var(--ink)}
.ct-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.statchip{display:inline-flex;align-items:center;height:24px;padding:0 14px;border-radius:20px;background:rgba(217,217,217,.4);border:1px solid rgba(255,255,255,.8);font:400 12px/1 "Crimson Text",Georgia,serif;color:var(--muted)}
.actlink{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:20px;background:var(--sand);color:var(--brown);font-size:13px;text-decoration:none;font-weight:500}

@media (min-width:960px){
  .home{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;column-gap:48px}

}

/* Calendar */
.calwrap{position:relative;margin:4px -20px 0;padding:22px 20px 30px;border-radius:30px;background:linear-gradient(180deg,var(--bg) 0%,var(--sand) 50%,var(--bg) 100%)}

.cal-title{font:400 28px/30px "Crimson Text",Georgia,serif;color:var(--ink);min-width:140px;text-align:center}
.seg{display:flex;gap:6px;margin:22px 0 26px 14px}
.seg button{width:95px;height:36px;border-radius:30px;border:.5px solid var(--ink);font-size:16px;color:var(--ink)}
.seg button.on{background:var(--cosmos);color:var(--on-accent);border-color:var(--cosmos)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;max-width:330px;margin:0 auto;text-align:center}

.dcell.today{background:#7D6780;color:#fff}
.dcell.has::after{content:"";position:absolute;left:50%;bottom:1px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--poppy)}
.dcell.today.has::after{background:#fff}
.dcell[disabled]{opacity:.35;cursor:default}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}
.ymon{background:var(--surface);border-radius:16px;padding:10px 12px}
.ymon h3{font:600 16px/1.4 "Crimson Text",Georgia,serif;color:var(--brown);margin-bottom:6px}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ymg span{aspect-ratio:1;border-radius:3px;background:var(--sand)}
.ymg span.has{background:var(--poppy)}
.ymg span.no{background:transparent}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}

/* Log */
.logsheet{margin:6px -20px 0;padding:16px 20px 30px;background:var(--beach);border-radius:30px 30px 0 0;min-height:70dvh}

.search{display:flex;align-items:center;gap:8px;height:35px;border-radius:30px;background:#F0EDED;padding:0 16px;color:#585858;margin-top:18px}

/* Measure */
.numrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 18px}

.mcard{display:flex;align-items:flex-end;padding:14px;width:100%;height:100%;background:linear-gradient(160deg,var(--cosmos),var(--poppy));color:#fff;font:400 18px/21px "Crimson Text",Georgia,serif;text-align:left}

.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(30,20,28,.42);opacity:0;transition:opacity .35s var(--ease)}

.sheet h2{font:400 26px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin:6px 0 6px}
.sheet .lead{font-size:15px;color:var(--muted);margin-bottom:18px}
.sopt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;background:var(--bg);margin-bottom:10px;text-align:left;text-decoration:none;color:var(--ink)}
.sopt .so-i{width:40px;height:40px;border-radius:50%;background:var(--sand);color:var(--wine);display:flex;align-items:center;justify-content:center;flex:none}

.sopt span{font-size:13px;color:var(--muted)}

.breathe{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
.bstage{position:relative;width:220px;height:220px}
.bc{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:var(--cosmos);opacity:.85;transition:transform 4s cubic-bezier(.45,0,.55,1)}
.blabel{font:400 26px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin-top:10px;min-height:30px}
.bcount{font-size:13px;color:var(--muted);margin:4px 0 16px}
.gstep{text-align:center;padding:10px 0}
.gstep .gn{font:600 72px/1 "Crimson Text",Georgia,serif;color:var(--poppy)}

const ARTICLES={
 'okay':{title:"Okay, let's do this",short:'A 60 second plan',by:'Aroha team',cred:'',read:'2 min read',art:'grounding',act:'ground',body:[
  'A sixty second plan for the moment you feel an attack starting. Read it once now, so it is familiar when you need it.',
  {h:'The plan',list:['Name it: say to yourself, this is panic, it is uncomfortable and it passes.','Slow the exhale: in for 4, out for 6, five times.','Anchor: press your feet down and name three things you can see.','Choose one small next step: water, a seat, a message to someone you trust.']},
  'If you have added people you trust in Aroha, the SOS button can open a message to them in one tap.']},
 'sos-grounding':{title:'SOS grounding, the correct way',short:'SOS grounding',by:'Dr. Nilambari Tendulkar',cred:'MBBS MS psych',read:'4 min read',art:'grounding',act:'ground',body:[
  'Grounding pulls your attention out of the spiral and back into the room you are in. During a panic attack your body runs an alarm it does not need. Grounding does not switch that alarm off by force. It gives your brain something concrete to do while the wave passes.',
  'Most panic attacks peak within about ten minutes. You do not have to fight the wave, only stay with something steady until it drops.',
  {h:'Try one of these',list:['5-4-3-2-1: name five things you can see, four you can touch, three you can hear, two you can smell and one you can taste.','Longer out-breaths: breathe in for 4, out for 6. A slower exhale tells your nervous system it can settle.','Feet on the floor: press both feet down and notice the pressure, the texture under you, the floor holding you up.','Something cool: a splash of cool water on your face or a cold glass in your hands gives your senses a strong, simple signal.','Hold an object: a smooth stone, a ring, a patch of fabric. Describe its weight and texture to yourself.','Count or sort: count back from 100 in sevens, or name a fruit for every letter of the alphabet.']},
  'Afterwards, write one line in your journal. Over time those lines show you what works for you.',
  {src:'This is general guidance, not a diagnosis. If attacks are frequent or you notice chest pain that feels new or severe, see a doctor.'}]},
 'meditate':{title:'The right way to meditate',short:'The right way to meditate',by:'Aroha team',cred:'',read:'3 min read',art:'night',act:'breathe',body:[
  'There is no single right way. The most useful kind of meditation is the one you will actually repeat.',
  'Start with three minutes. Pick an anchor, like your breath or the sounds around you. Your mind will wander. Noticing that and coming back is the practice, not a sign you are doing it wrong.',
  'If focusing on your breath makes you more anxious, switch the anchor to sounds or to the feeling of your hands.']},
 'help-course':{title:'When to ask for help',by:'Dr. Nilambari Tendulkar',cred:'MBBS MS psych',read:'6 min read',art:'help',body:[
  'Self-care tools help, but they are not a replacement for treatment when anxiety starts shaping your days.',
  {h:'Signs it is time to talk to a professional',list:['You avoid people, places or tasks because you fear an attack.','Worry takes up most of your day for weeks.','Sleep, study or work have started to slip.','You rely on alcohol or other substances to calm down.']},
  'Finding the right therapist can take more than one try. That is normal, not a failure. If you feel unsafe or in danger, contact your local emergency number, or open SOS in Aroha for a helpline near you.']},
 'self-love':{title:'Why self-love?',by:'Tia Parekh',cred:'counselling psychologist',read:'5 min read',art:'hug',body:[
  'Self-love is less about treats and more about the voice you use with yourself when things go wrong. Anxiety often comes with a harsh inner critic that predicts failure and replays mistakes.',
  'Self-compassion research suggests that treating yourself the way you would treat a friend lowers stress and makes it easier to try again after a setback.',
  {h:'A two minute practice',list:['Notice: this is a hard moment.','Normalise: many people feel this way.','Offer one kind sentence you would say to a friend, and say it to yourself.']}]},
 'healing':{title:'How self-love helps healing',by:'Monica',cred:'',read:'5 min read',art:'heartHold',body:[
  'Recovery is rarely a straight line. Kindness towards yourself on bad days makes it more likely you will keep going on the good ones.',
  'Try ending the day by writing one thing you handled, however small. Over weeks this becomes evidence against the voice that says you are not coping.']},
 'sleep':{title:'When your mind won’t switch off at night',short:'Sleep and a busy mind',by:'Aroha team',cred:'',read:'4 min read',art:'sleep',body:[
  'Anxiety and sleep feed each other. A short night makes worry louder the next day, and worry makes the next night shorter. Small, steady habits break the loop better than trying hard to fall asleep.',
  {h:'What tends to help',list:['Keep the same wake-up time every day, even after a bad night. It steadies your body clock faster than an early bedtime.','Give worries a slot earlier in the evening: ten minutes to write them down with one next step each.','If you have been lying awake for what feels like twenty minutes, get up, do something quiet in dim light, and go back when you feel sleepy.','Keep caffeine to the morning, and leave your phone outside arm’s reach.']},
  'Log your sleep in Aroha for a couple of weeks. Seeing it next to your mood often shows the pattern more clearly than memory does.',
  {src:'If you snore loudly, stop breathing in your sleep, or have struggled to sleep for months, talk to a doctor.'}]},
 'connect':{title:'Learning to connect',by:'Tia Parekh',cred:'counselling psychologist',read:'5 min read',art:'connect',body:[
  'Anxiety tends to pull people inward. Cancelling plans feels like relief in the moment and makes the next plan harder.',
  'Reconnection works best in small steps: a voice note instead of a call, a short coffee instead of a whole evening, telling one person what you are going through.',
  'If you have been avoiding someone you care about because you fear being triggered, it can help to agree on a signal for when you need a break.']},
 'yoga':{title:'Move to settle your body',by:'Monica',cred:'yoga teacher',read:'4 min read',art:'yoga',body:[

 return '<button class="ltile" data-go="article" '+P({id:id})+'>'+art(a.art)+'<span class="lt'+(a.art==='night'||a.art==='sleep'?' dark':'')+'">'+esc(a.short||a.title)+'</span>'+(S.saved.includes(id)?'<span class="vtag">'+I.bookmarkF+'</span>':'')+'</button>'}
V.library=p=>{const q=(p.q||'').toLowerCase(),sv=p.saved;const match=id=>{const a=ARTICLES[id];return (!q||(a.title+' '+a.by+' '+a.body.map(x=>typeof x==='string'?x:'').join(' ')).toLowerCase().includes(q))&&(!sv||S.saved.includes(id))};
 const secs=TOPICS.map(s=>[s[1],s[2].filter(match)]).filter(s=>s[1].length);
 return shell('library','<h1 class="sr">Library</h1><div class="lsearch"><label class="search"><span class="sr">Search the library</span>'+I.search+'<input id="libq" placeholder="Search reads" value="'+esc(p.q||'')+'" data-input="libSearch"></label><button class="iconbtn" data-act="libSaved" aria-pressed="'+!!sv+'" aria-label="'+(sv?'Show all reads':'Show saved reads')+'" style="'+(sv?'color:var(--poppy)':'')+'">'+(sv?I.bookmarkF:I.bookmark)+'</button></div><div id="libres">'+(secs.length?secs.map(s=>'<h2 class="lsec">'+s[0]+'</h2><div class="lgrid">'+s[1].map(ltile).join('')+'</div>').join(''):'<p class="empty" style="margin-top:24px">'+(sv?'Nothing saved yet. Tap the bookmark on any read to keep it here.':'No reads match “'+esc(p.q)+'”. Try panic, sleep or breathing.')+'</p>')+'</div>')};
INP.libSearch=i=>{route.p=Object.assign({},route.p,{q:i.value});const pos=i.selectionStart;rerender();const n=$('#libq');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
ACT.libSaved=()=>{route.p=Object.assign({},route.p,{saved:!route.p.saved});rerender()};
V.article=p=>{const id=ARTICLES[p.id]?p.id:'sos-grounding',a=ARTICLES[id],sv=S.saved.includes(id);
 return shell('library','<article class="article"><div class="art-top"><button class="iconbtn" data-act="back" aria-label="Back">'+I.back+'</button><button class="iconbtn" data-act="saveArt" data-id="'+id+'" aria-pressed="'+sv+'" aria-label="'+(sv?'Remove bookmark':'Bookmark')+'" style="'+(sv?'color:var(--poppy)':'')+'">'+(sv?I.bookmarkF:I.bookmark)+'</button></div><h1 class="art-title">'+esc(a.title)+'</h1><div class="byline"><span class="av">'+initials(a.by)+'</span><div><b>'+esc(a.by)+(a.cred?', '+esc(a.cred):'')+'</b><span>'+esc(a.read)+'</span></div></div><div class="banner">'+art(a.art)+'</div><div class="abody">'+a.body.map(x=>typeof x==='string'?'<p>'+esc(x)+'</p>':x.src?'<p class="src">'+esc(x.src)+'</p>':'<h3>'+esc(x.h)+'</h3><ul>'+x.list.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>').join('')+'</div>'+(a.act?'<div class="center" style="margin-top:8px"><button class="btn poppy" data-act="'+a.act+'" data-s="0">Try it now</button></div>':'')+'</article>')};
ACT.saveArt=b=>{const id=b.dataset.id,i=S.saved.indexOf(id);if(i>-1)S.saved.splice(i,1);else S.saved.push(id);save();toast(i>-1?'Removed from saved':'Saved to your library');rerender()};

/* ---------- to-dos ---------- */
function dayKey(d){return d==='tomm'?dkey(addDays(new Date(),1)):dkey()}
function tasksFor(d){const k=dayKey(d);if(!S.tasks[k])S.tasks[k]=[];return S.tasks[k]}
function trow(t,d){const n=t.steps.length,dn=t.steps.filter(s=>s.done).length;return '<li><button class="box'+(t.done?' on':'')+'" data-act="toggleTask" data-id="'+t.id+'" data-d="'+d+'" role="checkbox" aria-checked="'+t.done+'" aria-label="'+esc(t.t)+'">'+I.check+'</button><button class="ttext" data-go="breakdown" '+P({id:t.id,d:d})+'>'+esc(t.t)+(t.from?'<span class="carry">from '+(t.from===dkey(addDays(new Date(),-1))?'yesterday':esc(t.from.slice(5).split('-').reverse().join('/')))+'</span>':'')+(n?'<small>'+dn+' of '+n+' steps</small>':'')+'</button></li>'}
V.todos=p=>{const d=p.d||'today',list=tasksFor(d),pend=list.filter(t=>!t.done),done=list.filter(t=>t.done);
 return shell('todos','<div class="todo-head"><div class="glowbg" style="left:-80px;top:-60px"></div><h1 class="todo-title">TO - DO’S</h1><div class="pills" role="tablist"><button role="tab" aria-selected="'+(d==='today')+'" class="'+(d==='today'?'on':'')+'" data-act="todoDay" data-d="today">Today</button><button role="tab" aria-selected="'+(d==='tomm')+'" class="'+(d==='tomm'?'on':'')+'" data-act="todoDay" data-d="tomm">Tomorrow</button></div></div><div class="tgrid2"><section class="card tcard"><h2>'+(d==='today'?'Plan for today':'Plan for tomorrow')+'</h2><ul class="tlist">'+pend.map(t=>trow(t,d)).join('')+'</ul>'+(!pend.length?'<p class="small muted" style="margin-bottom:6px">'+(done.length?'Everything is done. Rest counts too.':'Nothing planned yet. Add one small thing.')+'</p>':'')+'<form class="addrow" data-submit="addTask" data-d="'+d+'"><span class="box" aria-hidden="true"></span><label class="sr" for="addT">Add a task</label><input id="addT" name="t" maxlength="80" placeholder="Add a task"><button aria-label="Add task">'+I.plus+'</button></form><p class="hint" style="text-align:left">Tap a task to break it into small steps.</p></section>'+(d==='today'?'<section class="card tcard"><h2>Done for today</h2>'+(done.length?'<ul class="tlist">'+done.map(t=>trow(t,d)).join('')+'</ul>':'<p class="small muted">Ticked tasks land here.</p>')+'</section>':'')+'</div>')};
ACT.todoDay=b=>{route.p={d:b.dataset.d};rerender()};
ACT.toggleTask=b=>{const t=tasksFor(b.dataset.d).find(x=>x.id===b.dataset.id);if(!t)return;t.done=!t.done;save();if(t.done)toast('Nice. One thing done.');rerender()};
ACT.addTask=f=>{const v=f.t.value.trim();if(!v){f.t.focus();return}tasksFor(f.dataset.d).push(task(v));save();rerender();const n=$('#addT');if(n)n.focus()};
V.breakdown=p=>{const t=tasksFor(p.d).find(x=>x.id===p.id);if(!t)return V.todos({d:p.d});const n=t.steps.length,dn=t.steps.filter(s=>s.done).length;
 return shell('todos','<div class="todo-head"><div class="glowbg" style="left:-80px;top:-60px"></div><div class="row-between"><button class="iconbtn" data-act="back" aria-label="Back">'+I.back+'</button><h1 class="todo-title">TO - DO’S</h1><button class="iconbtn" data-act="delTask" data-id="'+t.id+'" data-d="'+p.d+'" aria-label="Delete task">'+I.trash+'</button></div><div class="pills"><button class="on" tabindex="-1">'+(p.d==='tomm'?'Tomorrow':'Today')+'</button></div></div><div class="bdhead">'+esc(t.t)+'</div><section class="card bdcard"><h2>Finish the breakdown. You’ve got this.</h2>'+(n?'<div class="progress" aria-label="'+dn+' of '+n+' steps done"><i style="width:'+(dn/n*100)+'%"></i></div>':'')+'<ul class="tlist">'+t.steps.map((s,i)=>'<li><button class="box'+(s.done?' on strong':'')+'" role="checkbox" aria-checked="'+s.done+'" data-act="toggleStep" data-i="'+i+'" aria-label="'+esc(s.t)+'">'+I.check+'</button><span class="ttext">'+esc(s.t)+'</span><button class="iconbtn" style="width:32px;height:32px;color:var(--faint)" data-act="delStep" data-i="'+i+'" aria-label="Remove step">'+I.close+'</button></li>').join('')+'</ul><form class="addrow" data-submit="addStep"><span class="box" aria-hidden="true"></span><label class="sr" for="addS">Add a step</label><input id="addS" name="t" maxlength="80" placeholder="'+(n?'Next tiny step':'Jot down the first tiny step')+'"><button aria-label="Add step">'+I.plus+'</button></form><div class="center" style="margin-top:14px"><button class="btn poppy sm" data-act="finishTask">Finish</button></div></section>')};
function curTask(){return tasksFor(route.p.d).find(x=>x.id===route.p.id)}
ACT.toggleStep=b=>{const t=curTask();const s=t.steps[+b.dataset.i];s.done=!s.done;save();rerender()};
ACT.delStep=b=>{const t=curTask();t.steps.splice(+b.dataset.i,1);save();rerender()};
ACT.addStep=f=>{const v=f.t.value.trim();if(!v)return;curTask().steps.push({t:v,done:false});save();rerender();const n=$('#addS');if(n)n.focus()};
ACT.finishTask=()=>{const t=curTask();t.done=true;t.steps.forEach(s=>s.done=true);save();toast('Task finished. Well done.');back('todos')};
ACT.delTask=b=>{if(!confirm('Delete this task?'))return;const k=dayKey(b.dataset.d);S.tasks[k]=S.tasks[k].filter(x=>x.id!==b.dataset.id);save();back('todos')};

/* ---------- you ---------- */
V.profile=()=>shell('home','<div class="prof"><button class="iconbtn" data-act="back" aria-label="Back">'+I.back+'</button><div class="prof-top"><span class="prof-av">'+initials(S.user.name)+'</span><h1>'+esc(S.user.name||'You')+'</h1></div><form class="pinrow namerow" data-submit="saveName" style="margin-bottom:26px;flex-wrap:nowrap"><label class="sr" for="epn">Your name</label><input class="inp" id="epn" name="name" maxlength="60" placeholder="What should we call you?" value="'+esc(S.user.name)+'"><button class="btn outline sm">Save</button></form><div class="plist">'+[['contacts','Your people',I.heart],['account','Privacy & data',I.lock],['goalsEdit','Your goals',I.spark],['helpc','Help centre',I.life],['about','About Aroha',I.info],['legal','Legal information',I.book]].map(x=>'<button '+(x[0]==='goalsEdit'?'data-act="goalsEdit"':'data-go="'+x[0]+'"')+'><span class="pl-l">'+x[2]+esc(x[1])+'</span>'+I.next+'</button>').join('')+'</div><p class="hint">Aroha '+APP_VERSION+'</p></div>');
ACT.saveName=f=>{S.user.name=f.name.value.trim().slice(0,60);save();toast('Saved');rerender()};
ACT.goalsEdit=()=>openSheet('<h2>Your goals</h2><p class="lead">These shape what Home shows first.</p><div role="group" aria-label="Goals">'+GOALS.map(g=>'<button class="opt" data-act="goal" data-g="'+g+'" aria-pressed="'+S.goals.includes(g)+'"><span>'+g+'</span><span class="hrt">'+I.heartF+'</span></button>').join('')+'</div><button class="btn wide" data-act="closeSheet">Done</button>');
const sub=(t,inner)=>shell('home','<div class="subpage"><button class="iconbtn" data-act="back" aria-label="Back">'+I.back+'</button><h1>'+t+'</h1>'+inner+'</div>');
V.contacts=()=>sub('Your people','<p>People you trust on a hard day. The SOS button can open a text to them in one tap. Aroha never contacts them on its own.</p><div class="card contacts" style="margin-bottom:18px">'+(S.contacts.length?S.contacts.map(c=>'<div class="ct"><div class="row-between"><p class="ct-name">'+esc(c.name)+'</p><button class="iconbtn" data-act="delContact" data-id="'+c.id+'" aria-label="Remove '+esc(c.name)+'">'+I.trash+'</button></div><form class="numrow" style="justify-content:flex-start;margin:4px 0 0" data-submit="setPhone" data-id="'+c.id+'"><label class="sr" for="ph'+c.id+'">Phone for '+esc(c.name)+'</label><input class="inp" id="ph'+c.id+'" name="ph" type="tel" inputmode="tel" style="width:100%;max-width:240px;font-size:16px;text-align:left" placeholder="+91 phone number" value="'+esc(c.phone)+'"><button class="btn sm" style="min-width:80px">Save</button></form><span class="errt" id="ph'+c.id+'-e"></span></div>').join(''):'<p class="muted">No one added yet.</p>')+'</div><h2 class="subsec">Add someone</h2><form id="acF" data-submit="addContactF" novalidate><div class="fld"><label for="acn">Name</label><input class="inp" id="acn" name="name" maxlength="60" placeholder="A friend, sibling or partner"><span class="errt" id="acn-e"></span></div><div class="fld"><label for="acp">Phone</label><input class="inp" id="acp" name="ph" type="tel" inputmode="tel" placeholder="+91 phone number"><span class="errt" id="acp-e"></span></div></form><div class="center"><button class="btn" data-act="submitForm" data-f="acF">Add</button></div>');
ACT.setPhone=f=>{const v=f.ph.value.trim();if(!fieldErr('ph'+f.dataset.id,v&&!phoneOk(v)?'Enter a valid phone number':''))return;const c=S.contacts.find(x=>x.id===f.dataset.id);c.phone=v;save();toast('Number saved')};
ACT.addContactF=f=>{if(!addContact(f.name.value.trim(),f.ph.value.trim()))return;save();toast('Added');rerender()};
ACT.delContact=b=>{if(!confirm('Remove this person?'))return;S.contacts=S.contacts.filter(c=>c.id!==b.dataset.id);save();rerender()};
V.about=()=>sub('About Aroha','<p><b>Aroha</b> is a Māori word meaning love, related to the Hawaiian aloha. It can also be read as aro, to pay attention, and hā, the breath. The four circles of our logo stand for the four upper chakras.</p><p><b>The challenge.</b> How can young adults with generalised anxiety be helped to look after their overall health, so the condition does not hold back their everyday life?</p><p><b>Our approach.</b> Rooted in empathy, research and lived experience, Aroha gently supports people in managing anxiety: not with overwhelming fixes, but with calm intention. It came out of interviews with people who described fear of the next attack, confusion afterwards, and tools that felt generic.</p><h2 class="subsec" style="margin-top:20px">What Aroha offers</h2><ul class="consent"><li><b>Help in the moment:</b> SOS breathing, grounding and your people, one tap away.</li><li><b>Patterns you can see:</b> a two-second check-in and a journal that shows mood, sleep and symptoms over time.</li><li><b>A safe box</b> of happy memories and voice notes for hard days.</li><li><b>Small steps:</b> to-dos that break big tasks down, and short reads from experts.</li></ul>');
V.helpc=()=>{const h=helpline();return sub('Help centre','<div class="helpcard"><b>Need to talk to someone now?</b>'+(h.num?'<p style="margin:6px 0 0">'+esc(h.name)+'. '+esc(h.note)+'.</p><a href="tel:'+h.num+'">'+I.phone+'Call '+esc(h.disp||h.num)+'</a>':'<p style="margin:6px 0 0">Find a free, confidential helpline in your country.</p><a href="https://findahelpline.com" target="_blank" rel="noopener">'+I.phone+'findahelpline.com</a>')+'<p style="margin:12px 0 0">If you are in immediate danger, '+(h.emerg?'call '+h.emerg:'call your local emergency number')+'.</p></div><div class="acc">'+[['Is Aroha a medical device?','No. Aroha helps you notice patterns and practise coping skills. It does not diagnose or treat any condition.'],['Why doesn’t Aroha track heart rate?','Checking your pulse again and again tends to keep attention on body sensations, which can feed anxiety rather than calm it. Phone camera readings are also unreliable. If you have a heart concern, see a doctor.'],['Where is my data stored?','Only in your browser on this device. There is no account and no server. Clearing your browser data removes it, so download a backup now and then from Privacy & data.'],['How do I move Aroha to a new phone?','Download your data from Privacy & data, then on the new phone tap Restore from a backup on the welcome screen.'],['How do I install Aroha on my phone?','On Android, use Add to home screen in Privacy & data or in your browser menu. On iPhone, open Aroha in Safari, tap Share, then Add to Home Screen.']].map(q=>'<details><summary>'+q[0]+'</summary><p>'+esc(q[1])+'</p></details>').join('')+'</div>')};
V.legal=()=>sub('Legal information','<p>Aroha is a design prototype and is not a substitute for professional medical advice, diagnosis or treatment. Always seek the advice of a qualified health provider with questions about a medical condition.</p><p>Your entries, photos and recordings are stored only in this browser. Aroha has no account, no server and no tracking, and makes no requests to other websites.</p><p>Icons by Phosphor Icons (MIT licence). Fonts: Crimson Text, Roboto and Caveat (SIL Open Font Licence).</p><p>Aroha is for people aged 18 and over. Version '+APP_VERSION+'.</p>');
V.account=()=>{const lockOK=!!(window.crypto&&crypto.subtle);
 return sub('Privacy &amp; data',
 (canInstall()?'<h2 class="subsec">Install</h2><p>Add Aroha to your home screen so it opens like an app, even offline.</p><button class="btn" data-act="install" style="margin-bottom:28px">Add to home screen</button>':'')+
 '<h2 class="subsec">App lock</h2>'+(!lockOK?'<p>App lock needs a secure (https) connection.</p>':S.lock?'<p>On. Aroha asks for your PIN when it opens and after 5 minutes away. SOS still works while locked.</p><form id="lkOff" class="pinrow" data-submit="lockOff"><label class="sr" for="lkO">Current PIN</label><input class="inp pin" id="lkO" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN"><button class="btn outline sm">Turn off</button></form><p class="errt" id="lkO-e"></p>':'<p>Ask for a 4-digit PIN when Aroha opens. Useful on a shared phone. SOS still works while locked.</p><form id="lkOn" class="pinrow" data-submit="lockOn"><label class="sr" for="lk1">New PIN</label><input class="inp pin" id="lk1" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="PIN"><label class="sr" for="lk2">Repeat PIN</label><input class="inp pin" id="lk2" name="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="Again"><button class="btn sm">Turn on</button></form><p class="errt" id="lk1-e"></p>')+
 '<h2 class="subsec" style="margin-top:28px">Crisis line region</h2><p>Used by the SOS button and Help centre.</p><label class="tg" style="max-width:343px"><span class="tg-v">'+esc(helpline().label)+'</span><span class="tg-c">'+I.down+'</span><select aria-label="Crisis line region" data-input="region">'+Object.keys(HELPLINES).map(k=>'<option value="'+k+'"'+(helpline().code===k?' selected':'')+'>'+HELPLINES[k].label+'</option>').join('')+'</select></label>'+
 '<h2 class="subsec" style="margin-top:28px">Appearance</h2><div class="unit" role="group" aria-label="Appearance" style="width:max-content;margin-bottom:28px">'+[['','System'],['light','Light'],['dark','Dark']].map(t=>'<button class="'+(S.theme===t[0]?'on':'')+'" data-act="theme" data-t="'+t[0]+'" aria-pressed="'+(S.theme===t[0])+'">'+t[1]+'</button>').join('')+'</div>'+
 '<h2 class="subsec">Your data</h2><p>Everything lives on this device. Take a copy now and then, move it to another phone, or delete everything.</p><div class="btnrow" style="margin-bottom:16px"><button class="btn sm" data-act="exportData">'+I.download+'Download my data</button><button class="btn outline sm" data-act="importData">'+I.upload+'Restore from file</button></div><button class="btn outline" style="border-color:var(--alert);color:var(--alert)" data-act="resetAll">Delete all data</button>')};
INP.region=s=>{S.region=s.value;save();rerender()};
ACT.theme=b=>{S.theme=b.dataset.t;save();applyTheme();rerender()};
function wipe(){db.clear();S=fresh();locked=false;applyTheme();depth=0;go('welcome',{},true)}

/* export / import */
const backupJSON=()=>JSON.stringify(Object.assign({},S,{lock:null,exportedAt:new Date().toISOString(),app:'aroha',appVersion:APP_VERSION}),null,1);
ACT.exportData=()=>{openSheet('<h2>Your data</h2><p class="lead">A copy of everything Aroha stores on this device. Keep it somewhere private: it includes your journal.</p><div class="btnrow" style="margin-bottom:14px"><button class="btn sm" data-act="dlData">'+I.download+'Download file</button><button class="btn outline sm" data-act="copyData">Copy</button></div><label class="sr" for="jsonOut">Backup</label><textarea class="jsonbox" id="jsonOut" readonly></textarea>',sh=>{$('#jsonOut',sh).value=backupJSON()})};
ACT.dlData=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));a.download='aroha-backup-'+dkey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('If nothing downloaded, use Copy instead.')};
ACT.copyData=()=>{const t=$('#jsonOut');(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Copied')).catch(()=>{t.select();toast('Select all and copy the text')})};
ACT.importData=()=>$('#fileJson').click();
$('#fileJson').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>20e6)return toast('That file is too large to be an Aroha backup.');
 const r=new FileReader();r.onload=()=>{let d;try{d=normalise(JSON.parse(r.result))}catch(err){return toast(err instanceof SyntaxError?'That file is not valid JSON.':err.message)}
  if(S.onboarded&&!confirm('Replace everything on this device with this backup?'))return;d.lock=S.lock;S=d;carryOver(S);if(!save())return;applyTheme();toast('Backup restored');go(S.consentAt?'home':'consent',{},true)};r.readAsText(f)});

/* app lock. shortcut: a 4-digit PIN in browser storage only stops casual access on a shared phone; real protection needs encrypted storage tied to an account. */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(pin,salt){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin)))}
const pinOk=v=>/^\d{4}$/.test(v);
ACT.lockOn=async f=>{const a=f.pin.value,b=f.pin2.value;if(!pinOk(a))return fieldErr('lk1','Use exactly 4 digits');if(a!==b)return fieldErr('lk1','The two PINs don’t match');const salt=hex(crypto.getRandomValues(new Uint8Array(16)));S.lock={salt:salt,hash:await pinHash(a,salt)};save();toast('App lock is on');rerender()};
ACT.lockOff=async f=>{if(!S.lock)return;if(await pinHash(f.pin.value,S.lock.salt)!==S.lock.hash)return fieldErr('lkO','That PIN is not right');S.lock=null;save();toast('App lock is off');rerender()};
V.lock=()=>'<div class="lock" role="dialog" aria-modal="true" aria-labelledby="lockH">'+logo(43)+'<h1 class="h-ob serif" id="lockH">Welcome back</h1><p class="muted small">Enter your 4-digit PIN</p><form id="lockF" class="pinrow" data-submit="unlock" style="justify-content:center"><label class="sr" for="pinIn">PIN</label><input class="inp pin" id="pinIn" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" data-input="pinAuto"></form><p class="errt" id="pinIn-e" role="alert"></p><button class="btn" data-act="submitForm" data-f="lockF">Unlock</button><button class="sos-pill" data-act="openSOS">'+I.life+'<span>SOS</span></button><button class="linkbtn" data-act="forgotPin">Forgot PIN?</button></div>';
A.lock=()=>{const i=$('#pinIn');if(i)i.focus()};
INP.pinAuto=i=>{if(pinOk(i.value))ACT.unlock(i.form)};
ACT.unlock=async f=>{if(!S.lock){locked=false;return render(true)}if(await pinHash(f.pin.value,S.lock.salt)===S.lock.hash){locked=false;render(true)}else{f.pin.value='';fieldErr('pinIn','That PIN is not right. Try again.')}};
ACT.forgotPin=()=>{if(confirm('Your PIN only exists on this device, so the only way back in is to delete Aroha’s data here. Delete everything?'))wipe()};
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(S.lock&&!locked&&Date.now()-hiddenAt>5*60e3){locked=true;closeSheet(true);paint()}});

/* PWA: only when served top-level over https (or localhost). Inside the Claude artifact viewer this stays off. */
let installEvt=null;
const topLevel=(()=>{try{return window.top===window}catch(e){return false}})();
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function canInstall(){return !standalone()&&(!!installEvt||(isIOS&&topLevel))}
if(topLevel&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 [['manifest','manifest.webmanifest'],['apple-touch-icon','icons/apple-touch-icon.png'],['icon','icons/favicon-32.png']].forEach(x=>{const l=document.createElement('link');l.rel=x[0];l.href=x[1];document.head.appendChild(l)});
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker registration failed',e)));
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(route.n==='home'||route.n==='account')rerender()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Aroha is on your home screen')});
window.addEventListener('offline',()=>toast('You are offline. Everything still saves on this device.'));
ACT.install=async()=>{if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;return rerender()}
 openSheet('<h2>Add Aroha to your home screen</h2><ol class="consent"><li>Open this page in Safari.</li><li>Tap the Share button.</li><li>Choose Add to Home Screen, then Add.</li></ol><button class="btn wide" data-act="closeSheet">Got it</button>')};
ACT.installLater=()=>{S.installDismissed=true;save();rerender()};

/* ---------- global events ---------- */
ACT.back=()=>back();
ACT.closeSheet=()=>closeSheet();
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled){e.preventDefault();closeSheet(true);let p={};try{p=g.dataset.p?JSON.parse(g.dataset.p):{}}catch(x){}go(g.dataset.go,p);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.tagName!=='A')e.preventDefault();ACT[a.dataset.act](a,e)}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.submit&&ACT[f.dataset.submit]){e.preventDefault();ACT[f.dataset.submit](f,e)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.input&&INP[t.dataset.input])INP[t.dataset.input](t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.input&&INP[t.dataset.input])INP[t.dataset.input](t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet-root').firstChild)closeSheet()});
window.addEventListener('error',e=>console.error('Aroha error',e.error||e.message));
window.addEventListener('unhandledrejection',e=>{console.error('Aroha async error',e.reason);toast('Something didn’t work. Your data is safe.')});

/* Self-check for the risky logic (input trust boundary, migration, crisis words). Run Aroha.selfTest() in the console or in tests. */
window.Aroha=Object.freeze({version:APP_VERSION,selfTest(){const bad=[],ok=(c,m)=>{if(!c)bad.push(m)};
 ok(esc('<a href="x">')==='&lt;a href=&quot;x&quot;&gt;','esc');ok(initials('<b x')==='&lt;X','initials escaped');
 let threw=false;try{normalise({})}catch(e){threw=true}ok(threw,'rejects non-backups');
 const n=normalise({v:2,tasks:{'2026-01-01':[{t:'a'},{t:5}]},logs:{'2026-01-01':{mood:'gloomy',symptoms:['Sweating','<img>']},'2026-01-02':{mood:'<b>'},x:{}},sleep:{'2026-01-01':'6-7h','2026-01-03':'8h+'},mood:{'2026-01-04':'excited'},hr:[{bpm:72}],
  photos:[{id:'a',kind:'img',src:'javascript:alert(1)'},{id:'q',kind:'img',src:'data:image/png;base64,AA" onerror="x'},{id:'b',kind:'img',src:'data:image/png;base64,AA=='},{id:'s',kind:'art',art:'wing'}],recs:[{id:'r',src:'https://evil'},{id:'z',sample:1,dur:5}],tempUnit:'<x>',theme:'<x>',contacts:[{name:'A',phone:'<script>'}],region:'ZZ',profile:{goals:['Learn','<x>'],gender:'male'}});
 ok(n.photos.length===1&&n.photos[0].id==='b','unsafe and sample images dropped');ok(n.recs.length===0,'remote and silent audio dropped');ok(!('hr' in n)&&!('profile' in n),'removed features dropped');
 ok(n.logs['2026-01-01'].mood==='sad'&&n.logs['2026-01-01'].sleep==='6-7h'&&n.logs['2026-01-01'].symptoms.length===1,'v2 log migrated');ok(!n.logs['2026-01-02']&&!n.logs.x,'empty and bad logs dropped');
 ok(n.logs['2026-01-03'].sleep==='8h+'&&n.logs['2026-01-04'].mood==='happy','old trackers folded in');ok(n.tasks['2026-01-01'].length===1,'tasks cleaned');
 ok(n.theme===''&&n.region===''&&n.goals.join()==='Learn','enums whitelisted');ok(n.contacts[0].phone==='','phone validated');
 ok(CRISIS.test('I don’t want to live')&&!CRISIS.test('I killed it at my exam'),'crisis words');
 return bad.length?bad:'ok'}});
render(true);
})();
