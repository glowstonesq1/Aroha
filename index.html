:root{
  --bg:#FFFAFA;--surface:#FFFFFF;--sand:#F7E9DE;--beach:#F4E2DA;--blush:#F2DFDF;--glow:#FFD8D8;
  --cosmos:#59445B;--nav:#81687F;--poppy:#C25C9A;--poppy-soft:#CF89AE;--wine:#8C3D4C;--brown:#4F3422;
  --ink:#1E1E1E;--text:#231C1F;--muted:#585858;--faint:#999999;--line:#E8DCD7;--chip:#FAFAFA;
  --chip-line:rgba(56,54,54,.5);--on-accent:#FFFAFA;--nav-text:#F7E9DE;--alert:#C2353A;--ok:#3E7A4C;
  --card-shadow:0 4px 4px #E2DCDC;--soft-shadow:0 1.5px 3px rgba(0,0,0,.22);--float:0 18px 40px -18px rgba(89,68,91,.35);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C171C;--surface:#28212A;--sand:#3A2E36;--beach:#3B2D32;--blush:#30252C;--glow:#4C2B3D;
    --cosmos:#8E7191;--nav:#4C3C4E;--poppy:#D272B0;--poppy-soft:#A86A8C;--wine:#E59CAA;--brown:#EBD6CA;
    --ink:#F6ECEE;--text:#EDE2E5;--muted:#BBADB3;--faint:#8D8188;--line:#40343B;--chip:#2E262E;
    --chip-line:rgba(255,240,245,.35);--nav-text:#F7E9DE;--alert:#FF8C8C;--ok:#8FD19E;
    --card-shadow:0 4px 12px rgba(0,0,0,.35);--soft-shadow:0 1.5px 3px rgba(0,0,0,.5);--float:0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C171C;--surface:#28212A;--sand:#3A2E36;--beach:#3B2D32;--blush:#30252C;--glow:#4C2B3D;
  --cosmos:#8E7191;--nav:#4C3C4E;--poppy:#D272B0;--poppy-soft:#A86A8C;--wine:#E59CAA;--brown:#EBD6CA;
  --ink:#F6ECEE;--text:#EDE2E5;--muted:#BBADB3;--faint:#8D8188;--line:#40343B;--chip:#2E262E;
  --chip-line:rgba(255,240,245,.35);--nav-text:#F7E9DE;--alert:#FF8C8C;--ok:#8FD19E;
  --card-shadow:0 4px 12px rgba(0,0,0,.35);--soft-shadow:0 1.5px 3px rgba(0,0,0,.5);--float:0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column}
.welcome,.ob,.ready{flex:1 0 auto}
.main{width:100%}
h1,h2,h3,p{margin:0}
.serif{font-family:"Crimson Text",Georgia,"Times New Roman",serif}
.script{font-family:Caveat,"Segoe Script","Bradley Hand",cursive}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--poppy);outline-offset:3px;border-radius:8px}
svg{display:block}
.ic{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{display:flex;justify-content:center}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:148px;height:45px;padding:0 26px;border-radius:30px;background:var(--cosmos);color:var(--on-accent);font:400 20px/1 "Crimson Text",Georgia,serif;transition:transform .2s var(--ease),background .3s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.poppy{background:var(--poppy);font-weight:600}
.btn.sm{min-width:112px;height:35px;font-size:14px;font-weight:600;padding:0 18px}
.btn.wide{width:100%;max-width:343px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mini{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:112px;padding:0 14px;border-radius:20px;background:#7C6780;color:#fff;font:600 12px/1 "Crimson Text",Georgia,serif;border:1px solid rgba(255,255,255,.7)}
.linkbtn{color:var(--poppy);font-size:15px;padding:8px;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);transition:background .2s}
.iconbtn:hover{background:var(--blush)}
.iconbtn.light{color:#fff}
.iconbtn.light:hover{background:rgba(255,255,255,.15)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:20px;background:var(--chip);border:.5px solid var(--chip-line);font:400 14px/1 Roboto,sans-serif;color:var(--ink);white-space:nowrap;transition:background .25s var(--ease),color .25s}
.chip.on{background:var(--poppy);border-color:var(--poppy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.tag{display:inline-block;font:500 11px/1 Roboto,sans-serif;padding:4px 8px;border-radius:20px;background:var(--sand);color:var(--brown);vertical-align:middle}
.card{background:var(--surface);border-radius:20px;padding:18px 22px}

/* Splash */
.splash{position:fixed;inset:0;background:var(--bg);overflow:hidden;z-index:60;cursor:pointer}
.sgrp{position:absolute;left:50%;top:50%;width:0;height:0}
.sc{position:absolute;width:112px;height:112px;left:-56px;top:-56px;border-radius:50%;background:var(--cosmos);opacity:0;will-change:transform,opacity}
.splash-copy{position:absolute;left:50%;top:50%;width:260px;transform:translate(-130px,-6px);pointer-events:none}
.splash-copy .word{font-size:48px;line-height:1;color:var(--wine);clip-path:inset(0 100% 0 0);font-weight:500}
.splash-copy p{font-size:32px;line-height:30px;color:var(--ink);margin-top:16px;width:230px;opacity:0}
.skip{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--muted);padding:10px 14px;border-radius:20px}

/* Welcome */
.welcome{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px;overflow:hidden}
.welcome::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36%;background:linear-gradient(180deg,var(--bg) 0%,var(--blush) 80.5%);z-index:0;pointer-events:none}
.wl-grid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
.collage{position:relative;width:min(306px,78vw,calc(52dvh*.612));aspect-ratio:306/500;margin-top:22px}
.collage .p{position:absolute;overflow:hidden;background:var(--sand)}
.collage svg{width:100%;height:100%}
.p1{left:0;top:0;width:48%;height:52.2%;border-radius:999px}
.p2{left:54.6%;top:1.2%;width:37.9%;height:24.2%;border-radius:50%}
.p3{left:53.9%;top:27.2%;width:41.2%;height:44.8%;border-radius:999px}
.p4{left:.6%;top:54.8%;width:47.4%;height:30.2%;border-radius:50%}
.p5{left:47.4%;top:73.6%;width:52.6%;height:33.5%;border-radius:50%}
.p5::after{content:"";position:absolute;inset:0;background:linear-gradient(0.72deg,var(--bg) 49.5%,rgba(255,255,255,0) 99%)}
.wl-copy{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-6px}
.care{position:relative;font-size:32px;line-height:30px;font-weight:400;color:var(--ink);text-align:left;width:220px}
.care .hl{position:relative;z-index:0}
.care .hl::before{content:"";position:absolute;left:-14px;right:-6px;top:1px;height:35px;border-radius:20px;background:linear-gradient(90.46deg,rgba(242,223,223,.3) .47%,rgba(242,174,173,.55) 50%,rgba(243,225,225,.3) 99.7%);z-index:-1}
.care .aw{font-size:34px;color:var(--brown);margin-left:4px}
.wl-logo{color:var(--cosmos);position:relative;z-index:1}

/* Onboarding */
.ob{min-height:100%;display:grid;grid-template-columns:1fr}
.ob-art{display:none}
.ob-in{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:20px 23px 36px;min-height:100%}
.ob-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:30px;color:var(--cosmos)}
.ob-top .lg{justify-self:center}
.h-ob{font-size:28px;line-height:30px;font-weight:400;color:var(--ink)}
.h-ob.b{font-weight:600}
.sub-ob{font-size:24px;line-height:30px;margin:10px 0 24px;color:var(--ink)}
.ob-foot{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;align-items:center;gap:10px}
.uniq{list-style:none;padding:0;margin:26px 0 0}
.uniq li{display:flex;gap:4px;font:400 24px/30px Roboto,sans-serif;color:var(--ink);width:245px;padding:4px 0 12px;border-bottom:1px solid var(--ink);margin-bottom:20px;opacity:0;transform:translateY(10px);animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i) * 260ms + 200ms)}
.uniq sup{font-size:14px;font-weight:500;line-height:1;margin-top:4px}
@keyframes rise{to{opacity:1;transform:none}}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.fld>label,.fld>.lbl{font:500 16px/1.5 Roboto,sans-serif;letter-spacing:-.011em;color:var(--ink);padding-left:13px}
.inp{width:100%;height:56px;border-radius:1000px;background:var(--surface);border:1px solid transparent;box-shadow:var(--soft-shadow);padding:0 24px;font-size:16px;outline:none;transition:border .2s}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--cosmos)}
.inp.err{border-color:var(--alert)}
.errt{font-size:13px;color:var(--alert);padding-left:16px;min-height:0}
.or{display:flex;align-items:center;gap:14px;margin:8px 0 22px;font-weight:600;color:var(--ink)}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--faint)}
.soc{display:flex;align-items:center;justify-content:center;gap:10px;width:217px;height:44px;margin:0 auto 15px;border:.5px solid var(--ink);border-radius:30px;background:var(--bg);font-size:14px;color:var(--ink)}
.newuser{text-align:center;font-size:16px;margin-top:14px}
.newuser button{color:#1D6FD8}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 24px 0 31px;border-radius:1000px;background:var(--surface);border:1px solid transparent;margin-bottom:14px;font-size:16px;color:var(--ink);transition:border .2s}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--ink)}
.opt .hrt{color:#C9C7C5;transition:color .25s,transform .3s var(--ease)}
.opt[aria-pressed="true"] .hrt{color:var(--wine);transform:scale(1.12)}
.gcards{display:flex;flex-direction:column;gap:8px}
.gcard{position:relative;height:155px;border-radius:32px;background:var(--surface);border:1px solid transparent;padding:16px;overflow:hidden;box-shadow:0 8px 16px rgba(75,52,37,.05);text-align:left}
.gcard[aria-checked="true"]{border-color:var(--brown)}
.gcard .gt{position:relative;z-index:1;font:800 16px/19px Roboto,sans-serif;color:#3F3C36}
.gcard .gs{position:absolute;left:16px;bottom:16px;z-index:1;color:#3F3C36}
.gcard .gart{position:absolute;right:-6px;top:0;bottom:0;width:62%}
.gcard .gart svg{width:100%;height:100%}
.skipbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:1000px;background:var(--wine);color:#fff;font:800 16px/1 Roboto,sans-serif;margin-top:16px}
.qlbl{font-size:24px;line-height:30px;margin:18px 0 18px}
.tg{position:relative;display:flex;align-items:center;height:56px;width:100%;padding:4px;border-radius:32px;background:var(--surface)}
.tg .tg-v{display:flex;align-items:center;padding-left:28px;width:50%;height:48px;border-radius:1234px;background:var(--sand);font:800 16px/19px Roboto,sans-serif;color:var(--ink)}
.tg .tg-v.ph{color:var(--faint);font-weight:400}
.tg .tg-c{position:absolute;right:66px;color:var(--brown)}
.tg select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tg:focus-within{outline:2px solid var(--poppy);outline-offset:2px}
.ready{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:var(--cosmos);touch-action:pan-x}
.ready .rw{font-size:34px;color:#271A11;margin-top:4px}
.swipe{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 20px/26px "Crimson Text",Georgia,serif;color:#271A11}
.swipe .ic{animation:nudge 1.8s var(--ease) infinite}
@keyframes nudge{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
:root[data-theme="dark"] .ready .rw,:root[data-theme="dark"] .swipe{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ready .rw,:root:not([data-theme="light"]) .swipe{color:var(--ink)}}

/* App shell */
.navwrap{position:fixed;left:0;right:0;bottom:0;padding:0 9px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none}
.nav{pointer-events:auto;width:100%;max-width:400px;height:51px;background:var(--nav);border-radius:30px;display:flex;align-items:center;padding:0 8px 0 14px;box-shadow:var(--float)}
.nav button{flex:1;text-align:center;font:400 14px/30px "Crimson Text",Georgia,serif;color:var(--nav-text);padding:6px 2px;border-radius:14px;white-space:nowrap}
.nav button[aria-current="page"]{text-decoration:underline;text-underline-offset:3px}
.nav .nlogo{flex:none;display:flex;align-items:center;gap:10px;margin-right:6px;color:#FFFAFA}
.nav .nword,.nav .nav-sos{display:none}
.main{position:relative;isolation:isolate;max-width:1120px;margin:0 auto;padding:16px 20px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
.topbar .brand{font-size:22px;color:#271A11}
:root[data-theme="dark"] .topbar .brand{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar .brand{color:var(--ink)}}
@media (min-width:960px){
  .navwrap{top:0;bottom:0;right:auto;width:250px;padding:20px 0 20px 20px;align-items:stretch}
  .nav{flex-direction:column;align-items:stretch;height:auto;max-width:none;padding:28px 14px 20px;gap:4px}
  .nav button{flex:none;text-align:left;font-size:19px;padding:8px 16px}
  .nav button[aria-current="page"]{background:rgba(255,250,250,.13);text-decoration:none}
  .nav .nlogo{margin:0 0 30px 10px;padding:0;background:none!important}
  .nav .nword{display:inline;font-size:30px;color:#FFFAFA;line-height:1}
  .nav .nav-sos{display:block;margin-top:auto;text-align:center;background:var(--wine);color:#fff;font-weight:600;border-radius:30px;padding:10px}
  .main{margin-left:270px;margin-right:auto;padding:24px 44px 60px;max-width:1080px}
  .topbar .brand{visibility:hidden}
}

/* Home */
.home{display:grid;gap:8px}
.dtitle{font-size:24px;line-height:30px;font-weight:400;color:var(--ink);margin-top:14px}
.subsec{font:600 20px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin:2px 0 12px}
.sec{font:600 20px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin:26px 0 12px}
.sos-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 10px;border-radius:30px;background:var(--wine);color:#fff;font:600 15px/1 Roboto,sans-serif;margin-top:14px}
.sos-pill .ic{width:18px;height:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hcard{display:flex;flex-direction:column;align-items:flex-start;min-height:210px;padding:15px 20px 16px;border-radius:30px;background:linear-gradient(180deg,var(--bg) 0%,var(--sand) 50%,var(--bg) 100%);box-shadow:var(--card-shadow);transition:transform .3s var(--ease)}
.hcard:active{transform:scale(.98)}
.hc-t{font:600 22px/30px "Crimson Text",Georgia,serif;color:var(--ink);display:flex;align-items:center;gap:6px}
.hc-t .ic{width:16px;height:16px;color:var(--muted)}
.hc-art{flex:1;display:flex;align-items:center;padding:6px 0}
.hc-art svg{width:86px;height:80px}
.hc-v{font:400 20px/26px Roboto,sans-serif;color:var(--ink)}
.hc-s{font:400 15px/22px Roboto,sans-serif;color:var(--muted)}
.hc-s.warn{color:var(--alert);font-weight:600}
.hc-s.good{color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,96px);gap:7px}
.ins{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:96px;height:111px;padding:10px 12px 12px;border-radius:10px;background:var(--bg);box-shadow:0 4px 4px rgba(0,0,0,.18);font:500 12px/15px Roboto,sans-serif;color:var(--ink);text-align:left}
.ins .ip{align-self:center;width:32px;height:31px;border-radius:50%;background:#7C6780;color:#fff;display:flex;align-items:center;justify-content:center}
.ins .ip .ic{width:16px;height:16px}
.ins svg.ia{align-self:center;width:58px;height:52px}
.keep{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:14px;max-width:420px}
.keep b{font:500 14px/15px Roboto,sans-serif;color:var(--brown)}
.keep span{font:500 12px/15px Roboto,sans-serif;color:var(--brown);margin-bottom:10px}
.journey-wrap{position:relative;padding:20px 0 4px}
.glowbg{position:absolute;left:-60px;top:-20px;width:300px;height:280px;border-radius:50%;background:radial-gradient(closest-side,var(--glow) 0%,transparent 100%);z-index:-1;pointer-events:none;opacity:.9}
.datechip{display:block;width:max-content;margin:0 auto;padding:2px 14px;border-radius:20px;background:rgba(217,217,217,.4);border:1px solid rgba(255,255,255,.8);font:400 12px/20px "Crimson Text",Georgia,serif;color:var(--muted)}
.journey{font:400 32px/30px "Crimson Text",Georgia,serif;color:var(--ink);text-align:center;max-width:180px;margin:18px auto 22px}
.journey-wrap .chips{justify-content:center;margin-bottom:22px}
.feed{display:grid;gap:17px;justify-items:center}
.fcard{position:relative;display:block;width:100%;max-width:297px;height:185px;border-radius:20px;overflow:hidden;color:#fff;text-align:left;transition:transform .35s var(--ease)}
.fcard:active{transform:scale(.98)}
.fcard.g1{background:linear-gradient(111.31deg,#80677E 60.94%,#F7DAC3 98.43%)}
.fcard.g2{background:linear-gradient(124.42deg,#FCD9C9 1.35%,#C35E9C 34.54%)}
.fcard.g3{background:linear-gradient(120deg,#4F3422 0%,#8C3D4C 60%,#E7B6A4 100%)}
.fcard.g4{background:linear-gradient(115deg,#59445B 30%,#C25C9A 100%)}
.fc-title{position:absolute;left:28px;top:20px;width:150px;font:400 28px/30px "Crimson Text",Georgia,serif;z-index:1}
.fc-meta{position:absolute;left:28px;bottom:16px;font:400 12px/20px Roboto,sans-serif;z-index:1;display:grid;gap:2px}
.fc-meta span{display:flex;align-items:center;gap:6px}
.fc-meta .ic{width:12px;height:12px}
.fc-kind{position:absolute;right:14px;top:12px;z-index:2;font-size:11px;background:rgba(30,20,28,.38);padding:3px 8px;border-radius:20px}
.fc-art{position:absolute;right:-6px;bottom:0;width:58%;max-width:200px;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%)}
.fc-art svg{width:100%;height:100%}
.empty{padding:26px 20px;text-align:center;color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:20px;max-width:340px;margin:0 auto}
.contacts .ct{padding:12px 0;border-bottom:1px solid var(--line)}
.contacts .ct:last-child{border-bottom:0}
.ct-name{font:400 24px/30px "Crimson Text",Georgia,serif;color:var(--ink)}
.ct-ph{font:600 20px/30px "Crimson Text",Georgia,serif;color:var(--ink)}
.ct-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.statchip{display:inline-flex;align-items:center;height:24px;padding:0 14px;border-radius:20px;background:rgba(217,217,217,.4);border:1px solid rgba(255,255,255,.8);font:400 12px/1 "Crimson Text",Georgia,serif;color:var(--muted)}
.actlink{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:20px;background:var(--sand);color:var(--brown);font-size:13px;text-decoration:none;font-weight:500}
.actlink .ic{width:15px;height:15px}
@media (min-width:960px){
  .home{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;align-items:start;column-gap:48px;grid-template-areas:"check journey" "ins journey" "mood contacts"}
  .h-check{grid-area:check}.h-ins{grid-area:ins}.h-journey{grid-area:journey}.h-mood{grid-area:mood}.h-contacts{grid-area:contacts}
  .feed{justify-items:stretch}.fcard{max-width:none}
}

/* Calendar */
.calwrap{position:relative;margin:4px -20px 0;padding:22px 20px 30px;border-radius:30px;background:linear-gradient(180deg,var(--bg) 0%,var(--sand) 50%,var(--bg) 100%)}
.calhead{display:flex;align-items:center;justify-content:center;gap:10px}
.cal-title{font:400 28px/30px "Crimson Text",Georgia,serif;color:var(--ink);min-width:140px;text-align:center}
.seg{display:flex;gap:6px;margin:22px 0 26px 14px}
.seg button{width:95px;height:36px;border-radius:30px;border:.5px solid var(--ink);font-size:16px;color:var(--ink)}
.seg button.on{background:var(--cosmos);color:var(--on-accent);border-color:var(--cosmos)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;max-width:330px;margin:0 auto;text-align:center}
.mgrid .dh{font:600 24px/30px "Crimson Text",Georgia,serif;color:var(--brown)}
.dcell{position:relative;justify-self:center;width:38px;height:38px;border-radius:50%;font:400 22px/38px "Crimson Text",Georgia,serif;color:var(--brown);text-align:center}
.dcell.today{background:#7D6780;color:#fff}
.dcell.has::after{content:"";position:absolute;left:50%;bottom:1px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--poppy)}
.dcell.today.has::after{background:#fff}
.dcell[disabled]{opacity:.35;cursor:default}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}
.ymon{background:var(--surface);border-radius:16px;padding:10px 12px}
.ymon h3{font:600 16px/1.4 "Crimson Text",Georgia,serif;color:var(--brown);margin-bottom:6px}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ymg span{aspect-ratio:1;border-radius:3px;background:var(--sand)}
.ymg span.has{background:var(--poppy)}
.ymg span.no{background:transparent}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}

/* Log */
.logsheet{margin:6px -20px 0;padding:16px 20px 30px;background:var(--beach);border-radius:30px 30px 0 0;min-height:70dvh}
.ls-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.ls-head h1{text-align:center;font:400 28px/30px "Crimson Text",Georgia,serif;color:var(--ink)}
.lsgrid{display:grid;gap:12px;max-width:700px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;height:35px;border-radius:30px;background:#F0EDED;padding:0 16px;color:#585858;margin-top:18px}
.search input{flex:1;border:0;background:none;outline:none;font:400 14px "Crimson Text",Georgia,serif;color:#333}
.search .ic{width:16px;height:16px}
.protect{display:flex;align-items:center;justify-content:center;gap:6px;font:600 12px/30px "Crimson Text",Georgia,serif;color:var(--muted)}
.protect .ic{width:16px;height:16px}
.cardh{display:block;font:600 18px/30px "Crimson Text",Georgia,serif;color:var(--ink);margin-bottom:6px}
.moods{display:flex;justify-content:space-between;gap:4px}
.mood{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px/1.6 "Crimson Text",Georgia,serif;color:var(--muted);padding:4px;border-radius:14px;transition:background .25s}
.mood svg{width:39px;height:39px;color:var(--wine)}
.mood[aria-pressed="true"]{background:var(--sand);color:var(--ink)}
.symchips{display:flex;flex-wrap:wrap;gap:9px}
.note-warn{margin-top:12px;font-size:13px;line-height:1.5;color:var(--alert);background:rgba(194,53,58,.07);padding:10px 12px;border-radius:12px}
textarea.notes{width:100%;min-height:90px;border:0;outline:none;resize:vertical;background:none;font:400 14px/20px Roboto,sans-serif;color:var(--text)}
textarea.notes::placeholder{color:var(--muted)}

/* Measure */
.mhead{display:flex;align-items:center;gap:6px;margin-top:18px}
.mhead h1{font:600 22px/30px "Crimson Text",Georgia,serif;color:var(--ink)}
.mstage{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:420px;margin:0 auto;padding-bottom:20px}
.mlead{font:400 20px/24px "Crimson Text",Georgia,serif;color:var(--ink);margin:14px auto 0;max-width:300px}
.mtext{font:400 18px/22px "Crimson Text",Georgia,serif;color:var(--ink);max-width:320px;margin:10px auto 24px}
.mvis{position:relative;width:260px;height:260px;margin:22px auto 18px;display:flex;align-items:center;justify-content:center}
.mvis .sq1,.mvis .sq2{position:absolute;width:200px;height:196px;border-radius:12px}
.mvis .sq1{background:var(--bg);border:1px solid var(--line);transform:rotate(49deg)}
.mvis .sq2{background:var(--sand);transform:rotate(62deg)}
.mvis .ring{position:absolute;inset:0}
.mvis .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.mvis .hb{position:relative;width:74px}
.beat{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(.98)}45%{transform:scale(1.06)}}
.bignum{position:relative;font:600 44px/1 "Crimson Text",Georgia,serif;color:var(--ink);margin-bottom:6px}
.mresult{font:400 20px/24px "Crimson Text",Georgia,serif;color:var(--ink);margin-bottom:6px}
.mstatus{font-size:14px;color:var(--muted);margin-bottom:22px}
.mstatus.warn{color:var(--alert)}
.numrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 18px}
.numrow .inp{width:140px;text-align:center;font-size:22px}
.unit{display:flex;border-radius:30px;background:var(--surface);padding:3px;box-shadow:var(--soft-shadow)}
.unit button{padding:6px 14px;border-radius:30px;font-weight:500}
.unit button.on{background:var(--cosmos);color:var(--on-accent)}
.phonevis{width:200px;height:200px;margin:28px auto 20px}

/* Safe box & shared headers */
.welcome-h{position:relative;font:400 32px/30px "Crimson Text",Georgia,serif;color:var(--ink);text-align:center;max-width:225px;margin:12px auto 22px}
.safe-head{position:relative;padding-top:12px}
.safe-head .chips{justify-content:center}
.sbgrid{display:grid;gap:18px;margin-top:26px}
.sb-new{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 20px 26px;max-width:322px;width:100%;margin:0 auto}
.sb-new h2{font:400 24px/30px "Crimson Text",Georgia,serif;color:var(--brown)}
.sb-prompt{max-width:322px;width:100%;margin:0 auto}
.sb-prompt h2{font:400 24px/30px "Crimson Text",Georgia,serif;color:var(--brown)}
.sb-prompt p{font-size:14px;line-height:15px;color:var(--brown);margin:4px 0 14px}
.pinp{width:100%;height:50px;border-radius:30px;border:0;background:var(--surface);padding:0 22px;font:400 15px "Crimson Text",Georgia,serif;outline:none;box-shadow:var(--soft-shadow)}
.pinp::placeholder{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ptile{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--sand)}
.ptile img,.ptile svg{width:100%;height:100%;object-fit:cover}
.ptile .pt{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;font:600 18px/20px "Crimson Text",Georgia,serif;text-shadow:0 1px 6px rgba(0,0,0,.35);text-align:left}
.ptile .fav{position:absolute;right:10px;top:10px;color:#fff}
.mcard{display:flex;align-items:flex-end;padding:14px;width:100%;height:100%;background:linear-gradient(160deg,var(--cosmos),var(--poppy));color:#fff;font:400 18px/21px "Crimson Text",Georgia,serif;text-align:left}
.mcard.alt{background:linear-gradient(160deg,#C25C9A,#F7DAC3)}
.reclist{background:var(--surface);border-radius:30px;padding:10px 22px 22px;max-width:520px;width:100%;margin:0 auto}
.handle{width:46px;height:4px;border-radius:10px;background:var(--brown);margin:0 auto 10px}
.reclist h2{text-align:center;font:500 16px/30px Roboto,sans-serif;color:var(--ink);margin-bottom:8px}
.rec{display:grid;grid-template-columns:60px 1fr 41px;gap:16px;align-items:center;padding:9px 0}
.rec .rth{width:60px;height:58px;border-radius:50%;overflow:hidden;background:var(--sand)}
.rec .rth svg{width:100%;height:100%}
.rec .rt{font:400 16px/22px Roboto,sans-serif;color:var(--brown);text-align:left}
.rec .rd{display:flex;align-items:center;gap:5px;font:600 14px/22px Roboto,sans-serif;color:var(--brown)}
.rec .rd .ic{width:13px;height:13px}
.playc{width:41px;height:40px;border-radius:50%;background:var(--sand);color:var(--nav);display:flex;align-items:center;justify-content:center}
.playc .ic{width:16px;height:16px}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px auto 14px;height:40px;padding:0 20px;border-radius:30px;border:1px solid var(--poppy);color:var(--poppy);font-weight:500}
.recbtn.on{background:var(--poppy);color:#fff}
.recbtn .dot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.plcard{background:var(--surface);border-radius:20px;box-shadow:var(--card-shadow);padding:18px;max-width:340px;width:100%;margin:0 auto}
.plcard h3{font:600 24px/24px "Crimson Text",Georgia,serif;color:var(--brown);margin:14px 0 8px}
.plcover{height:150px;border-radius:16px;overflow:hidden;position:relative}
.plcover svg{width:100%;height:100%}
.plrow{display:grid;grid-template-columns:41px 1fr auto;gap:12px;align-items:center;padding:3px 0;color:var(--brown);font-size:14px;text-align:left;width:100%}
.plrow .playc .ic{color:var(--poppy)}
.plrow b{font-weight:600}

/* Fullscreen media */
.full{position:fixed;inset:0;z-index:40;background:#111;color:#fff;overflow:hidden}
.full .bgart{position:absolute;inset:0}
.full .bgart svg,.full .bgart img{width:100%;height:100%;object-fit:cover}
.full .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%)}
.full .ftop{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between}

/* PPG estimate from mean red level: detrend, smooth, count peaks, take the median interval. */
function bpmFrom(s){const late=s.filter(p=>p.t>2000); // first 2 s are exposure settling
 if(late.length<60)return {msg:'The camera didn\u2019t send enough frames. Close other camera apps and try again.'};
 const covered=late.filter(p=>p.r>60&&p.r>p.g*1.35).length/late.length;if(covered<.8)return {msg:'Your finger didn\u2019t fully cover the camera. Rest your fingertip gently over the lens and flash, without pressing hard.'};
 const det=late.map((p,i)=>{let sum=0,n=0;for(let j=Math.max(0,i-40);j<Math.min(late.length,i+40);j++){if(Math.abs(late[j].t-p.t)<450){sum+=late[j].r;n++}}return p.r-sum/n});
 const sm=det.map((v,i)=>((det[i-1]!=null?det[i-1]:v)+v+(det[i+1]!=null?det[i+1]:v))/3);
 const peaks=[];for(let i=1;i<sm.length-1;i++){if(sm[i]>0&&sm[i]>=sm[i-1]&&sm[i]>sm[i+1]){const t=late[i].t;if(!peaks.length||t-peaks[peaks.length-1]>330)peaks.push(t)}}
 if(peaks.length<6)return {msg:'The signal was too noisy. Sit down, rest your hand on a table and try again.'};
 const iv=[];for(let i=1;i<peaks.length;i++)iv.push(peaks[i]-peaks[i-1]);iv.sort((a,b)=>a-b);const med=iv[Math.floor(iv.length/2)];const bpm=Math.round(60000/med);
 if(bpm<40||bpm>180)return {msg:'That reading looked unreliable, so it wasn\u2019t saved. Try again or enter a reading manually.'};return {bpm:bpm}}

V.safebox=p=>{const tab=p.tab||'photos';const tabs=[['photos','Photos'],['videos','Videos'],['recordings','Recordings'],['playlist','Playlist']];let body='';
 if(tab==='photos')body='<div class="sbgrid"><div class="card sb-new"><h2>New Memories??</h2><button class="btn poppy sm" data-act="pickImg">Upload</button></div><div class="sb-prompt"><h2>Put in a prompt!</h2><p>Write a happy memory and the safe box turns it into a keepsake card you can come back to.</p><form id="gF" data-submit="genMemory"><label class="sr" for="gIn">Memory</label><input class="pinp" id="gIn" name="t" maxlength="160" placeholder="Put in a prompt"></form><div class="center" style="margin-top:22px"><button class="btn poppy sm" data-act="submitForm" data-f="gF">Generate</button></div></div><h2 class="sec" style="margin-bottom:0">Your memories</h2>'+(S.photos.length?'':'<p class="empty">Memories you upload or write will show up here.</p>')+'<div class="pgrid">'+S.photos.slice().reverse().map(ph=>'<button class="ptile" data-go="viewer" '+P({id:ph.id})+' aria-label="Open '+esc(ph.title||'memory')+'">'+photoInner(ph)+(ph.kind!=='card'&&ph.title?'<span class="pt">'+esc(ph.title)+'</span>':'')+(S.favs.includes(ph.id)?'<span class="fav">'+I.heartF+'</span>':'')+'</button>').join('')+'</div></div>';
 else if(tab==='videos')body='<div class="sbgrid">'+(videos.length?'<div class="pgrid">'+videos.map(v=>'<video src="'+v.url+'" controls playsinline style="width:100%;border-radius:20px;background:#000"></video>').join('')+'</div>':'<p class="empty">No videos yet. Add a clip that makes you smile.</p>')+'<div class="center"><button class="btn poppy sm" data-act="pickVid">Upload video</button></div><p class="hint">In this prototype videos stay for this session only.</p></div>';
 else if(tab==='recordings')body='<div class="sbgrid"><div class="reclist"><div class="handle"></div><h2>List of recordings</h2><button class="recbtn" id="recBtn" data-act="record">'+I.mic+'<span>Record a voice note</span></button>'+S.recs.map(r=>'<div class="rec"><span class="rth">'+art(r.art||'valley')+'</span><button class="rt" data-go="player" '+P({id:r.id})+'>'+esc(r.title)+(r.sample?' <span class="tag">Sample</span>':'')+'<span class="rd">'+I.clock+mmss(r.dur)+'</span></button><button class="playc" data-go="player" '+P({id:r.id})+' aria-label="Play '+esc(r.title)+'">'+I.play+'</button></div>').join('')+'</div></div>';
 else body='<div class="sbgrid">'+S.playlists.map(pl=>'<div class="plcard"><div class="plcover">'+art(pl.art)+'</div><h3>'+esc(pl.title)+'</h3>'+pl.items.map(id=>S.recs.find(r=>r.id===id)).filter(Boolean).map(r=>'<button class="plrow" data-go="player" '+P({id:r.id})+'><span class="playc">'+I.play+'</span><span>'+esc(r.title)+'</span><b>'+mmss(r.dur)+'</b></button>').join('')+'</div>').join('')+'</div>';

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$('#fileImg').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const src=await compress(f);S.photos.push({id:uid(),kind:'img',src:src,title:f.name.replace(/\.[^.]+$/,'').slice(0,24)});if(!save()){S.photos.pop();save();return toast(FULL)}toast('Memory added');if(route.n==='safebox')rerender()}catch(err){toast('That file couldn\u2019t be read as an image. Try a JPG or PNG.')}});
$('#fileVid').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{videos.push({url:URL.createObjectURL(f)});if(route.n==='safebox')rerender()}catch(err){toast('That video couldn\u2019t be opened here.')}});
ACT.genMemory=f=>{const t=f.t.value.trim();if(t.length<3){fieldErr('gIn','Write a few words about the memory first');toast('Write a few words about the memory first');return}S.photos.push({id:uid(),kind:'card',text:t,alt:S.photos.length%2,title:'Keepsake'});save();toast('Keepsake card added');rerender()};
/* Media lives in localStorage (about 5 MB). If an item doesn't fit, drop it instead of leaving
   every later save failing. shortcut: move media to IndexedDB when a backend or sync exists. */
const FULL='Not enough space on this device for that. Delete a few photos or recordings and try again.',REC_MAX=180;
let rec=null,recT=null;
ACT.record=async b=>{if(rec){rec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder){toast('Recording isn\u2019t supported in this browser.');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Microphone access was blocked. Allow it in your browser settings to record.');return}
 const chunks=[];try{rec=new MediaRecorder(st,{audioBitsPerSecond:32000})}catch(e){rec=new MediaRecorder(st)}const t0=Date.now();rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(recT);const dur=Math.max(1,Math.round((Date.now()-t0)/1000));const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;const fr=new FileReader();fr.onload=()=>{const d=new Date();S.recs.unshift({id:uid(),title:'Voice note, '+d.getDate()+' '+MON[d.getMonth()],dur:dur,src:fr.result,art:'valley'});if(!save()){S.recs.shift();save();return toast(FULL)}toast('Voice note saved');if(route.n==='safebox')rerender()};fr.readAsDataURL(blob)};
 rec.start();b.classList.add('on');b.innerHTML='<span class="dot"></span><span>Stop recording 0:00</span>';recT=setInterval(()=>{const sec=(Date.now()-t0)/1000;if(sec>=REC_MAX&&rec)return rec.stop();const s=$('#recBtn span:last-child');if(s)s.textContent='Stop recording '+mmss(sec)+' of '+mmss(REC_MAX)},500);
 cleanups.push(()=>{if(rec){rec.stop()}})};

 return '<div class="full" role="dialog" aria-label="Memory"><div class="bgart">'+photoInner(ph,true)+'</div><div class="shade"></div><div class="ftop"><button class="iconbtn light" data-act="back" aria-label="Back">'+I.back+'</button><div style="display:flex;gap:4px">'+(ph.kind!=='art'?'<button class="iconbtn light" data-act="delPhoto" data-id="'+ph.id+'" aria-label="Delete">'+I.trash+'</button>':'')+'<button class="iconbtn light" data-act="favPhoto" data-id="'+ph.id+'" aria-label="'+(fav?'Remove from favourites':'Add to favourites')+'" aria-pressed="'+fav+'">'+(fav?I.heartF:I.heart)+'</button></div></div><div class="fbot">'+(ph.kind!=='card'&&ph.title?'<p class="vcap">'+esc(ph.title)+'</p>':'')+(others.length?'<div class="thumbs">'+others.map(o=>'<button data-act="swapPhoto" data-id="'+o.id+'" aria-label="Open '+esc(o.title||'memory')+'">'+photoInner(o)+'</button>').join('')+'</div>':'')+'</div></div>'};

let PL=null;
A.player=p=>{const r=S.recs.find(x=>x.id===p.id)||S.recs[0];PL={r:r,pos:0,playing:false,timer:null,audio:null};if(r.src){const a=new Audio();a.src=r.src;a.onended=()=>{PL.playing=false;plUI()};a.onerror=()=>toast('This recording can\u2019t play in this browser.');a.ontimeupdate=()=>{PL.pos=a.currentTime;plUI()};PL.audio=a}cleanups.push(()=>{if(PL){clearInterval(PL.timer);if(PL.audio)PL.audio.pause();PL=null}})};

/* ---------- to-dos ---------- */
function dayKey(d){return d==='tomm'?dkey(addDays(new Date(),1)):dkey()}
function tasksFor(d){const k=dayKey(d);if(!S.tasks[k])S.tasks[k]=[];return S.tasks[k]}

/* app lock. shortcut: a 4-digit PIN in browser storage only stops casual access on a shared phone; real protection needs encrypted storage tied to an account. */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(pin,salt){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin)))}
const pinOk=v=>/^\d{4}$/.test(v);
ACT.lockOn=async f=>{const a=f.pin.value,b=f.pin2.value;if(!pinOk(a))return fieldErr('lk1','Use exactly 4 digits');if(a!==b)return fieldErr('lk1','The two PINs don\u2019t match');const salt=hex(crypto.getRandomValues(new Uint8Array(16)));S.lock={salt:salt,hash:await pinHash(a,salt)};save();toast('App lock is on');rerender()};
ACT.lockOff=async f=>{if(!S.lock)return;if(await pinHash(f.pin.value,S.lock.salt)!==S.lock.hash)return fieldErr('lkO','That PIN is not right');S.lock=null;save();toast('App lock is off');rerender()};
V.lock=()=>'<div class="lock" role="dialog" aria-modal="true" aria-labelledby="lockH">'+logo(43)+'<h1 class="h-ob serif" id="lockH">Welcome back</h1><p class="muted small">Enter your 4-digit PIN</p><form id="lockF" class="pinrow" data-submit="unlock" style="justify-content:center"><label class="sr" for="pinIn">PIN</label><input class="inp pin" id="pinIn" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" data-input="pinAuto"></form><p class="errt" id="pinIn-e" role="alert"></p><button class="btn" data-act="submitForm" data-f="lockF">Unlock</button><button class="sos-pill" data-act="openSOS">'+I.life+'<span>SOS</span></button><button class="linkbtn" data-act="forgotPin">Forgot PIN?</button></div>';
A.lock=()=>{const i=$('#pinIn');if(i)i.focus()};
INP.pinAuto=i=>{if(pinOk(i.value))ACT.unlock(i.form)};
ACT.unlock=async f=>{if(!S.lock){locked=false;return render(true)}if(await pinHash(f.pin.value,S.lock.salt)===S.lock.hash){locked=false;render(true)}else{f.pin.value='';fieldErr('pinIn','That PIN is not right. Try again.')}};
ACT.forgotPin=()=>{if(confirm('Your PIN only exists on this device, so the only way back in is to delete Aroha\u2019s data here. Delete everything?'))wipe()};
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(S.lock&&S.loggedIn&&!locked&&Date.now()-hiddenAt>5*60e3){locked=true;closeSheet(true);paint()}});

/* PWA: only when served top-level over https (or localhost). Inside the Claude artifact viewer this stays off. */
let installEvt=null;
const topLevel=(()=>{try{return window.top===window}catch(e){return false}})();
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function canInstall(){return !standalone()&&(!!installEvt||(isIOS&&topLevel))}
if(topLevel&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 [['manifest','manifest.webmanifest'],['apple-touch-icon','icons/apple-touch-icon.png'],['icon','icons/favicon-32.png']].forEach(x=>{const l=document.createElement('link');l.rel=x[0];l.href=x[1];document.head.appendChild(l)});
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker registration failed',e)));
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(route.n==='home'||route.n==='account')rerender()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Aroha is on your home screen')});
window.addEventListener('offline',()=>toast('You are offline. Everything still saves on this device.'));
ACT.install=async()=>{if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;return rerender()}
 openSheet('<h2>Add Aroha to your home screen</h2><ol class="consent"><li>Open this page in Safari.</li><li>Tap the Share button.</li><li>Choose Add to Home Screen, then Add.</li></ol><button class="btn wide" data-act="closeSheet">Got it</button>')};
ACT.installLater=()=>{S.installDismissed=true;save();rerender()};

/* ---------- global events ---------- */
ACT.back=()=>back();
ACT.closeSheet=()=>closeSheet();
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled){e.preventDefault();closeSheet(true);let p={};try{p=g.dataset.p?JSON.parse(g.dataset.p):{}}catch(x){}go(g.dataset.go,p);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.tagName!=='A')e.preventDefault();ACT[a.dataset.act](a,e)}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.submit&&ACT[f.dataset.submit]){e.preventDefault();ACT[f.dataset.submit](f,e)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.input&&INP[t.dataset.input])INP[t.dataset.input](t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.input&&INP[t.dataset.input])INP[t.dataset.input](t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet-root').firstChild)closeSheet()});
window.addEventListener('error',e=>console.error('Aroha error',e.error||e.message));
window.addEventListener('unhandledrejection',e=>{console.error('Aroha async error',e.reason);toast('Something didn\u2019t work. Your data is safe.')});

/* Self-check for the risky logic (input trust boundary, PPG maths). Run Aroha.selfTest() in the console or in tests. */
window.Aroha=Object.freeze({version:APP_VERSION,selfTest(){const bad=[],ok=(c,m)=>{if(!c)bad.push(m)};
 ok(esc('<a href="x">')==='&lt;a href=&quot;x&quot;&gt;','esc');ok(initials('<b x')==='&lt;X','initials escaped');
 let threw=false;try{normalise({})}catch(e){threw=true}ok(threw,'rejects non-backups');
 const n=normalise({v:2,tasks:{'2026-01-01':[{t:'a'},{t:5}]},logs:{'2026-01-01':{mood:'<b>',symptoms:['Sweating','<img>']},x:{}},hr:[{bpm:'<svg>'},{bpm:72}],photos:[{id:'a',kind:'img',src:'javascript:alert(1)'},{id:'b',kind:'img',src:'data:image/png;base64,AA'}],recs:[{id:'r',src:'https://evil'}],tempUnit:'<x>',theme:'<x>',contacts:[{name:'A',phone:'<script>'}],region:'ZZ'});
 ok(n.hr.length===1&&n.hr[0].bpm===72,'hr coerced');ok(n.photos.length===1&&n.photos[0].id==='b','unsafe image dropped');ok(n.recs.length===0,'remote audio dropped');
 ok(Object.keys(n.logs).length===1&&n.logs['2026-01-01'].mood===''&&n.logs['2026-01-01'].symptoms.length===1,'logs cleaned');ok(n.tasks['2026-01-01'].length===1,'tasks cleaned');
 ok(n.tempUnit==='F'&&n.theme===''&&n.region==='','enums whitelisted');ok(normalise({v:2,auth:{salt:'x',hash:'<b>'}}).auth===null,'auth validated');
 ok(CRISIS.test('I don\u2019t want to live')&&!CRISIS.test('I killed it at my exam'),'crisis words');ok(n.contacts[0].phone==='','phone validated');
 const syn=[];for(let t=0;t<15000;t+=33)syn.push({t:t,r:150+3*Math.sin(2*Math.PI*1.2*t/1000),g:40});const b=bpmFrom(syn);ok(b.bpm>=68&&b.bpm<=76,'72 bpm synthetic, got '+b.bpm);
 ok(bpmFrom(syn.map(x=>({t:x.t,r:40,g:60}))).msg,'uncovered camera rejected');
 return bad.length?bad:'ok'}});
render(true);
})();
